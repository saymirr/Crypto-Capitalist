<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto Capitalist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky wallet header over a trading-floor grid of business rows, with a side desk for managers/upgrades/forks. Single committed dark "midnight exchange" look. */
:root {
  color-scheme: dark;
  --bg: #0e1120;
  --surface: #171b31;
  --surface-2: #1f2440;
  --line: #2b3157;
  --fg: #ece9f7;
  --muted: #8e92b6;
  --gold: #f2b33d;
  --gold-ink: #241a03;
  --up: #3fd99a;
  --down: #ff7272;
  --glass: rgba(23, 27, 49, .8);
  --glass-top: rgba(14, 17, 32, .78);
  --display: "Chakra Petch", "Bahnschrift", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 0 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Backdrop city + coin bursts */
#bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#bg { z-index: 0; }
#fx { z-index: 25; }
.layout, .foot { position: relative; z-index: 1; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--glass-top); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); margin-inline: -16px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.coin { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe2a1, var(--gold) 55%, #b97a0c); box-shadow: inset 0 0 0 2px #c98b17; display: grid; place-items: center; color: var(--gold-ink); font-size: 12px; font-weight: 700; letter-spacing: 0; }
.wallet { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.cash { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 4.2vw, 38px); line-height: 1.05; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rate { color: var(--muted); font-size: 13px; }
.rate b { color: var(--up); font-weight: 500; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill strong { color: var(--fg); font-weight: 600; }
.pill.bull { border-color: var(--up); color: var(--up); }
.pill.bull strong { color: var(--up); }

.strip { max-width: 1320px; margin: 10px auto 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 6px 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 500; }
.news { flex: 1 1 280px; min-width: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.news .tag { font-family: var(--mono); color: var(--down); margin-right: 8px; letter-spacing: .06em; }

/* Main grid */
.layout { max-width: 1320px; margin: 18px auto 0; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } .desk { position: sticky; top: 150px; } }
.bizlist { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }

.biz { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; background: var(--glass); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile { position: relative; border: 0; border-radius: 10px; background: linear-gradient(160deg, hsl(var(--h) 70% 58%), hsl(var(--h) 60% 34%)); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px; min-height: 108px; padding: 4px 4px 14px; transition: transform .08s; overflow: hidden; }
.tile:active { transform: scale(.96); }
.tile .art { display: block; width: 66px; height: 66px; transition: transform .15s; }
.tile .art svg { display: block; width: 100%; height: 100%; }
.tile:hover .art { transform: translateY(-2px) scale(1.04); }
.tile.pop .art { animation: pop .25s ease-out; }
@keyframes pop { 40% { transform: scale(1.14) rotate(-4deg); } }
.tile .cnt { font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,.4); color: #fff; border-radius: 6px; padding: 1px 7px; }
.tile .ms { position: absolute; left: 8px; right: 8px; bottom: 7px; height: 4px; border-radius: 4px; background: rgba(0,0,0,.35); overflow: hidden; }
.tile .ms i { display: block; height: 100%; background: #fff; transform-origin: left; transform: scaleX(0); }
.tile.ready { box-shadow: 0 0 0 2px var(--gold); }
.body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
.name b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name .tk { font-family: var(--mono); font-size: 11px; font-weight: 500; color: hsl(var(--h) 80% 72%); letter-spacing: .06em; margin-left: 6px; }
.name small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.bar { position: relative; height: 32px; border-radius: 8px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar i { position: absolute; inset: 0; background: linear-gradient(90deg, #2c9c72, var(--up)); transform-origin: left; transform: scaleX(0); }
.bar.blur i { background: repeating-linear-gradient(-45deg, #2c9c72 0 10px, var(--up) 10px 20px); }
.bar span { position: relative; display: flex; height: 100%; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 500; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; padding-inline: 8px; overflow: hidden; }
.acts { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.buy { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.buy .bc { font-family: var(--mono); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.buy:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.timer { font-family: var(--mono); font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; min-width: 88px; justify-content: center; }
.biz.locked .tile { filter: grayscale(.85) brightness(.6); }
.biz.locked .bar span { color: var(--muted); }

/* Desk */
.desk { background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; border: 0; padding: 11px 4px; font-family: var(--display); font-weight: 500; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; position: relative; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--gold); }
.tabs .dot { position: absolute; top: 5px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.pane { padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }
.pane p.hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.card .t { font-weight: 600; min-width: 0; }
.card .d { grid-column: 1; color: var(--muted); font-size: 12px; min-width: 0; }
.card.av { grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 10px; }
.card.av .pic { grid-row: 1 / span 2; grid-column: 1; width: 44px; height: 44px; align-self: start; }
.card.av .pic svg { display: block; width: 100%; height: 100%; }
.card.av .t { grid-column: 2; grid-row: 1; }
.card.av .d { grid-column: 2 / span 2; grid-row: 2; }
.card.av button { grid-column: 3; grid-row: 1; }
.hired { display: flex; flex-wrap: wrap; gap: 6px; }
.hired span { width: 34px; height: 34px; display: block; }
.hired svg { display: block; width: 100%; height: 100%; }
.card button { grid-row: 1 / span 2; grid-column: 2; background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 8px; padding: 7px 10px; font-family: var(--mono); font-size: 12px; font-weight: 500; white-space: nowrap; }
.card button:disabled { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); cursor: not-allowed; }
.done { color: var(--muted); font-size: 12px; }
.statrow { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.statrow span:first-child { color: var(--muted); }
.big { font-family: var(--display); font-size: 30px; font-weight: 700; color: var(--fg); line-height: 1.1; }
.fork { background: var(--down); color: #2a0606; border: 0; border-radius: 8px; padding: 10px; font-weight: 600; }
.fork.ghost { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.fork:disabled { opacity: .45; cursor: not-allowed; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; }

/* Whale + toasts */
.whale { position: fixed; z-index: 20; width: 74px; height: 74px; border-radius: 50%; border: 2px solid #fff; background: radial-gradient(circle at 35% 30%, #9fe7ff, #2b8fd6 60%, #164c84); color: #fff; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .05em; box-shadow: 0 0 0 6px rgba(43,143,214,.25), 0 8px 24px rgba(0,0,0,.5); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.toasts { position: fixed; z-index: 30; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 8px; padding: 10px 12px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.foot { max-width: 1320px; margin: 24px auto 0; color: var(--muted); font-size: 12px; text-shadow: 0 1px 3px var(--bg), 0 0 8px var(--bg); }
@media (prefers-reduced-motion: reduce) { .whale { animation: none; } .tile, .tile .art { transition: none; } .tile.pop .art { animation: none; } }
@media (max-width: 520px) { .biz { grid-template-columns: 72px minmax(0, 1fr); } .tile .art { width: 56px; height: 56px; } .timer { min-width: 72px; } }
</style>
<style>html, body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="coin">₿</span>Crypto Capitalist</div>
    <div class="wallet">
      <div class="cash num" id="cash">$0.00</div>
      <div class="rate">Earning <b class="num" id="rate">$0</b> per second from automated businesses</div>
    </div>
    <div class="badges">
      <span class="pill" title="Each Diamond Hand adds 2% to all profits">Diamond Hands <strong class="num" id="dh">0</strong> · <strong class="num" id="dhb">+0%</strong></span>
      <span class="pill bull" id="bull" hidden>Bull run ×2 · <strong class="num" id="bullT">0s</strong></span>
    </div>
  </div>
  <div class="strip">
    <div class="seg" role="group" aria-label="Buy amount" id="seg">
      <button id="m-1" data-m="1" aria-pressed="true">×1</button>
      <button id="m-10" data-m="10" aria-pressed="false">×10</button>
      <button id="m-100" data-m="100" aria-pressed="false">×100</button>
      <button id="m-next" data-m="next" aria-pressed="false">Next</button>
      <button id="m-max" data-m="max" aria-pressed="false">Max</button>
    </div>
    <div class="news" id="news"><span class="tag">BREAKING</span><span id="newsT">Markets open. Number expected to go up.</span></div>
  </div>
</header>

<main class="layout">
  <section class="bizlist" id="bizlist" aria-label="Businesses"></section>
  <aside class="desk">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-mgr" data-tab="mgr" aria-selected="true">Managers<span class="dot" id="dot-mgr" hidden></span></button>
      <button role="tab" id="t-upg" data-tab="upg" aria-selected="false">Upgrades<span class="dot" id="dot-upg" hidden></span></button>
      <button role="tab" id="t-fork" data-tab="fork" aria-selected="false">Fork</button>
      <button role="tab" id="t-stats" data-tab="stats" aria-selected="false">Stats</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>
<p class="foot">Play money only. No real coins, wallets or exchanges are involved. Progress saves in this browser.</p>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
/* Crypto Capitalist: night-city backdrop + coin-burst fx.
 window.CCBG = { init(bgCanvas, api), fxInit(fxCanvas), burst(x, y, n) }
 api: owned(i)->bool, unlocked()->n, bull()->bool, rate()->$/s */
(function(){
var HUE=[42,18,140,300,95,205,165,255,0,330],
 TH=[.5,.55,.5,.6,.56,.82,.7,.8,.74,1], // height x skyline max
 TW=[.8,.7,1.15,1,1.1,.85,1,.95,1.25,.9], // width x base width
 // landmarks in a unit box (y up from street), wound clockwise:
 // r=rect x y w h, p=polygon x y.., w=window area x y w h, b=beacon x y (default: top)
 SH=[
  'p.08 0 .25 .62 .33 .62 .17 0p.83 0 .67 .62 .75 .62 .92 0r.46 0 .08 .62r.17 .3 .62 .04p0 .67 0 .88 1 .88 1 .67 .86 .6 .14 .6p-.04 .88 .5 1 1.04 .88w.1 .64 .8 .22', // faucet: tank on legs
  'r.3 0 .4 .1r.25 .1 .5 .62p.25 .72 .32 .88 .5 1 .68 .88 .75 .72p0 .04 0 .2 .25 .4 .25 .16p.75 .16 .75 .4 1 .2 1 .04w.36 .14 .28 .54', // meme rocket
  'r0 0 1 .8r0 .8 .04 .14r.12 .8 .04 .14r.24 .8 .04 .14r.36 .8 .04 .14r.48 .8 .04 .14r.6 .8 .04 .14r.72 .8 .04 .14r.84 .8 .04 .14r.96 .8 .04 .14w.07 .05 .86 .68b.5 .97', // GPU: heatsink fins
  'r0 0 1 .5r.14 .5 .72 .26r.28 .76 .44 .16r.42 .92 .16 .08w.06 .04 .88 .42w.2 .54 .6 .18', // NFT ziggurat
  'p0 0 0 .34 .26 .48 .52 .34 .52 0r.5 0 .46 .9p.5 .9 .55 .96 .64 .99 .73 1 .82 .99 .91 .96 .96 .9w.56 .05 .34 .78w.06 .05 .4 .24b.73 1', // barn + silo
  'p0 0 0 .78 1 .9 1 0r.78 .88 .04 .12w.07 .04 .86 .7b.8 1', // exchange
  'r.06 0 .88 .74r0 .74 1 .04p0 .78 .5 .93 1 .78r.48 .92 .04 .08w.12 .04 .76 .66', // bank crown
  'r0 0 .9 .3r.1 .3 .9 .26r.02 .56 .82 .22r.16 .78 .7 .15r.48 .93 .04 .07w.16 .04 .68 .86', // rollup layers
  'r0 0 1 .42p0 .42 0 .54 .25 .42 .25 .54 .5 .42 .5 .54 .75 .42 .75 .54 1 .42r.64 .42 .1 .44r.82 .42 .1 .58w.05 .05 .9 .3b.87 1', // ASIC factory
  'p0 0 .3 .68 .7 .68 1 0r.36 .66 .28 .16p.4 .82 .5 1 .6 .82w.27 .05 .46 .55w.4 .69 .2 .1' // L1 needle
 ];
var RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches),
 M=Math,TAU=M.PI*2,rnd=M.random,api={},cv,ctx,W=1,H=1,DPR=1,rt,
 sky,city,cityH=0,beacons=[],twk=[],key,wasBull,
 pts=[],sp=20,phase=0,off=0,band=1,cy=0,
 streaks=[],nextStreak=4,clock=0,last=0,raf=0,glows={};

function seeded(s){ // stable PRNG (LCG)
 s=s*1e4+7;
 return function(){return(s=s*16807%2147483647)/2147483647;};
}
function q(f,i){try{return api[f](i);}catch(e){return 0;}}
function mk(){return document.createElement('canvas');}
function hsla(h,s,l,a){return'hsla('+h+','+s+'%,'+l+'%,'+a+')';}
function layer(w,h,c){ // DPR-scaled 2d context
 c=c||mk();
 c.width=M.round(w*DPR);c.height=M.round(h*DPR);
 var g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
 return g;
}
function fit(c){ // fill viewport, DPR capped at 2
 DPR=M.min(2,window.devicePixelRatio||1);
 c.style.width=c.style.height='100%';
 var w=c.clientWidth||innerWidth,h=c.clientHeight||innerHeight;
 return{g:layer(w,h,c),w:w,h:h};
}
function glow(h){ // cached glow sprite
 var c=glows[h],g,r;
 if(!c){
  c=glows[h]=mk();c.width=c.height=64;
  g=c.getContext('2d');r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,hsla(h,92,62,1));r.addColorStop(.3,hsla(h,92,62,.35));r.addColorStop(1,hsla(h,92,62,0));
  g.fillStyle=r;g.fillRect(0,0,64,64);
 }
 return c;
}

// static sky: gradient, faint chart grid, stars
function buildSky(){
 var g=layer(W,H),R=seeded(11),i,x,y,r,a,gr=g.createLinearGradient(0,0,0,H);
 gr.addColorStop(0,'#0e1120');gr.addColorStop(.5,'#131331');gr.addColorStop(1,'#2a1a52');
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(142,146,182,.04)';
 for(i=1;i<6;i++)g.fillRect(0,M.round(H*(.04+.07*i)),W,1);
 twk=[];g.fillStyle='#dfe1ff'; // every 7th star twinkles
 for(i=M.min(240,W*H/6000|0);i--;){
  x=R()*W;y=M.pow(R(),1.4)*H*.72;r=R()<.08?1.6:.6+R()*.6;
  a=(.25+R()*.5)*(1-y/(H*.8));
  if(M.abs(x/W-.5)<.28&&R()<.5)continue; // fewer behind the content
  if(i%7==0)twk.push({x:x,y:y,r:r+.4,a:a+.15,p:R()*TAU,s:.8+R()*2});
  else{g.globalAlpha=a;g.fillRect(x,y,r,r);}
 }
 sky=g.canvas;
}

// landmark i into Path2D P; returns [window regions, beacon]
function shape(P,i,x,b,w,h){
 var wins=[],bc=[x+w/2,h];
 SH[i].match(/[a-z][^a-z]*/g).forEach(function(t){
  var n=t.slice(1).split(' ').map(Number),k,c=t[0];
  if(c=='r')P.rect(x+n[0]*w,b-(n[1]+n[3])*h,n[2]*w,n[3]*h);
  else if(c=='p'){for(k=0;k<n.length;k+=2)P[k?'lineTo':'moveTo'](x+n[k]*w,b-n[k+1]*h);P.closePath();}
  else if(c=='w')wins.push([x+n[0]*w,n[1]*h,n[2]*w,n[3]*h]);
  else bc=[x+n[0]*w,n[1]*h];
 });
 return[wins,bc];
}

// window grids; lit: 1 owned, 0 dark, else filler odds
function windows(g,regs,b,w,hue,R,lit){
 var sx=M.max(3.4,M.min(7,w/8)),ww=M.max(1.4,sx*.48),sy=sx*1.3,wh=sy*.5;
 regs.forEach(function(z){
  var cols=M.max(1,M.floor((z[2]-ww)/sx)+1),ox=z[0]+(z[2]-(cols-1)*sx-ww)/2,j,c,on,t;
  for(j=0;j<M.floor(z[3]/sy);j++)for(c=0;c<cols;c++){
   on=R();t=R();
   if(lit==1){if(on>.72)continue;g.fillStyle=t<.12?hsla(hue,90,72,.9):t<.55?'rgba(242,179,61,.85)':'rgba(255,214,130,.9)';}
   else if(!lit)g.fillStyle='rgba(130,118,210,.05)';
   else if(on<lit)g.fillStyle='rgba(242,179,61,.3)';
   else continue;
   g.fillRect(ox+c*sx,b-z[1]-j*sy-(sy+wh)/2,ww,wh);
  }
 });
}

// skyline strip; rebuilt on resize / owned-set change
function buildCity(){
 // height also capped by width, so phones keep tower shapes

  const g = Math.floor(Math.log10(n) / 3);
  if (g < NAMES.length) return (n / 10 ** (g * 3)).toFixed(3) + ' ' + NAMES[g];
  return n.toExponential(3);
}
const money = n => '$' + fmt(n);
function fmtTime(s) {
  if (s < 1) return s.toFixed(2) + 's';
  s = Math.ceil(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return [h, m, x].map(v => String(v).padStart(2, '0')).join(':');
}
function fmtDur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${Math.floor(s % 60)}s`;
}

/* ---------- economy ---------- */
const speedLevel = n => SPEED_MS.filter(m => n >= m).length;
const profitMs = n => n > 400 ? Math.floor((n - 400) / 100) : 0;
const cycleTime = i => BIZ[i].time / 2 ** speedLevel(st.biz[i].n);
const bull = () => Date.now() < st.bullUntil ? 2 : 1;
function mult(i) {
  let m = 1;
  for (const u of UPG) if (st.upg[u.id] && (u.t === i || u.t === -1)) m *= 3;
  return m * 2 ** profitMs(st.biz[i].n) * (1 + 0.02 * st.diamonds) * bull();
}
const cycleRev = i => BIZ[i].rev * st.biz[i].n * mult(i);
function rateSec() {
  let r = 0;
  st.biz.forEach((b, i) => { if (b.mgr && b.n) r += cycleRev(i) / cycleTime(i); });
  return r;
}
function costFor(i, k) {
  const b = BIZ[i], n = st.biz[i].n;
  return b.base * b.coef ** n * (b.coef ** k - 1) / (b.coef - 1);
}
function maxAfford(i) {
  const b = BIZ[i], n = st.biz[i].n;
  const k = Math.floor(Math.log(st.cash * (b.coef - 1) / (b.base * b.coef ** n) + 1) / Math.log(b.coef));
  return Math.max(0, k);
}
function nextMilestone(n) {
  for (const m of SPEED_MS) if (n < m) return m;
  return (Math.floor(n / 100) + 1) * 100;
}
function buyQty(i) {
  const n = st.biz[i].n;
  if (st.mode === 'next') return nextMilestone(n) - n;
  if (st.mode === 'max') return Math.max(1, maxAfford(i));
  return +st.mode;
}
function earn(x) { st.cash += x; st.run += x; st.allTime += x; }
const diamondsTotal = () => Math.floor(150 * Math.sqrt(st.allTime / 1e12));
const claimable = () => Math.max(0, diamondsTotal() - st.diamonds);

/* ---------- actions ---------- */
function buy(i) {
  const k = buyQty(i), c = costFor(i, k);
  if (c > st.cash) return;
  const before = st.biz[i].n;
  st.cash -= c;
  st.biz[i].n += k;
  if (before === 0) toast(`${BIZ[i].name} unlocked. Tap the ${BIZ[i].tk} tile to run it.`);
  const sb = speedLevel(before), sa = speedLevel(st.biz[i].n);
  if (sa > sb) toast(`${BIZ[i].name} hit ${SPEED_MS[sa - 1]}: ${2 ** (sa - sb) > 2 ? 'speed ×' + 2 ** (sa - sb) : 'twice as fast'}.`);
  if (profitMs(st.biz[i].n) > profitMs(before)) toast(`${BIZ[i].name} profits doubled.`);
  dirtyDesk = true;
}
function runBiz(i) {
  const b = st.biz[i];
  if (b.n > 0 && !b.on) b.on = true;
}
function hire(i) {
  if (st.cash < BIZ[i].mgr || st.biz[i].mgr) return;
  st.cash -= BIZ[i].mgr; st.biz[i].mgr = true; st.biz[i].on = st.biz[i].n > 0;
  toast(`${BIZ[i].mgrName} now runs ${BIZ[i].name}.`);
  dirtyDesk = true;
}
function buyUpg(id) {
  const u = UPG.find(x => x.id === id);
  if (!u || st.upg[id] || st.cash < u.cost) return;
  st.cash -= u.cost; st.upg[id] = 1;
  toast(`${u.name}: ${u.t === -1 ? 'all businesses' : BIZ[u.t].name} profit ×3.`);
  dirtyDesk = true;
}
let forkArmed = false;
function hardFork() {
  const c = claimable();
  const keep = { diamonds: st.diamonds + c, allTime: st.allTime, forks: st.forks + 1, played: st.played, mode: st.mode, tab: st.tab };
  st = Object.assign(fresh(), keep);
  forkArmed = false; dirtyDesk = true;
  toast(`Hard fork complete. ${c} Diamond Hands joined. Profits now +${st.diamonds * 2}%.`);
  save();
}

/* ---------- whale alerts ---------- */
let whaleAt = Date.now() + 45e3 + Math.random() * 45e3, whaleEl = null, whaleGone = 0;
function spawnWhale() {
  whaleEl = document.createElement('button');
  whaleEl.className = 'whale';
  whaleEl.id = 'whale';
  whaleEl.textContent = 'WHALE';
  whaleEl.setAttribute('aria-label', 'Whale alert: tap for a bonus');
  whaleEl.style.left = 16 + Math.random() * Math.max(0, innerWidth - 110) + 'px';
  whaleEl.style.top = 160 + Math.random() * Math.max(0, innerHeight - 260) + 'px';
  whaleEl.onclick = () => {
    const r = whaleEl.getBoundingClientRect();
    try { window.CCBG && CCBG.burst(r.left + r.width / 2, r.top + r.height / 2, 24); } catch (e) {}
    if (Math.random() < 0.5) {
      st.bullUntil = Math.max(Date.now(), st.bullUntil) + 30e3;
      toast('Whale buy wall spotted. Bull run: all profits ×2 for 30 seconds.');
    } else {
      const gift = Math.max(rateSec() * 600, st.cash * 0.1, 50);
      earn(gift);
      toast(`A whale tipped you ${money(gift)}.`);
    }
    removeWhale();
  };
  document.body.appendChild(whaleEl);
  whaleGone = Date.now() + 12e3;
}
function removeWhale() {
  if (whaleEl) whaleEl.remove();
  whaleEl = null;
  whaleAt = Date.now() + 60e3 + Math.random() * 90e3;
}

/* ---------- toasts ---------- */
const toastsEl = document.getElementById('toasts');
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  toastsEl.appendChild(t);
  while (toastsEl.children.length > 4) toastsEl.firstChild.remove();
  setTimeout(() => t.remove(), 4500);
}

/* ---------- business rows ---------- */
const listEl = document.getElementById('bizlist');
const rows = BIZ.map((b, i) => {
  const el = document.createElement('article');
  el.className = 'biz';
  el.innerHTML = `
    <button class="tile" id="tile-${i}" style="--h:${b.h}" aria-label="Run ${b.name}">
      <span class="art">${ART.biz[i] || ''}</span><span class="cnt num">0</span><span class="ms"><i></i></span>
    </button>
    <div class="body">
      <div class="name" style="--h:${b.h}"><b>${b.name}<span class="tk">${b.tk}</span></b><small class="nm"></small></div>
      <div class="bar"><i></i><span></span></div>
      <div class="acts">
        <button class="buy" id="buy-${i}"><span class="bq"></span><span class="bc"></span></button>
        <span class="timer"></span>
      </div>
    </div>`;
  listEl.appendChild(el);
  el.querySelector('.tile').onclick = () => runBiz(i);
  el.querySelector('.buy').onclick = () => buy(i);
  return {
    el, tile: el.querySelector('.tile'), cnt: el.querySelector('.cnt'), ms: el.querySelector('.ms i'),
    nm: el.querySelector('.nm'), bar: el.querySelector('.bar'), fill: el.querySelector('.bar i'), rev: el.querySelector('.bar span'),
    buy: el.querySelector('.buy'), bq: el.querySelector('.bq'), bc: el.querySelector('.bc'), timer: el.querySelector('.timer'),
  };
});

function drawBars() {
  st.biz.forEach((b, i) => {
    const r = rows[i], T = cycleTime(i);
    const fast = b.mgr && b.n > 0 && T < 0.15;
    r.bar.classList.toggle('blur', fast);
    r.fill.style.transform = `scaleX(${fast ? 1 : b.n ? Math.min(1, b.p) : 0})`;
  });
}
function drawText() {
  document.getElementById('cash').textContent = money(st.cash);
  document.getElementById('rate').textContent = money(rateSec());
  document.getElementById('dh').textContent = st.diamonds;
  document.getElementById('dhb').textContent = `+${st.diamonds * 2}%`;
  const left = st.bullUntil - Date.now();
  document.getElementById('bull').hidden = left <= 0;
  if (left > 0) document.getElementById('bullT').textContent = Math.ceil(left / 1000) + 's';

  st.biz.forEach((b, i) => {
    const r = rows[i], locked = b.n === 0;
    r.el.classList.toggle('locked', locked);
    r.cnt.textContent = b.n;
    r.tile.classList.toggle('ready', !locked && !b.on && !b.mgr);
    const nx = nextMilestone(b.n), prev = [0, ...SPEED_MS].filter(m => m <= b.n).pop() ?? Math.floor(b.n / 100) * 100;
    const lo = b.n >= 400 ? Math.floor(b.n / 100) * 100 : prev;
    r.ms.style.transform = `scaleX(${Math.min(1, (b.n - lo) / (nx - lo))})`;
    r.nm.textContent = locked ? '' : `next ${nx}: ${nx <= 400 ? 'speed ×2' : 'profit ×2'}`;
    const T = cycleTime(i);
    if (locked) r.rev.textContent = 'Not owned';
    else if (b.mgr && T < 1) r.rev.textContent = money(cycleRev(i) / T) + ' /sec';
    else r.rev.textContent = money(cycleRev(i));
    r.timer.textContent = locked ? '—' : fmtTime(b.on ? (1 - b.p) * T : T);
    const k = buyQty(i), c = costFor(i, k);
    r.bq.textContent = locked && k === 1 ? 'Unlock' : `Buy ×${k}`;
    r.bc.textContent = money(c);
    r.buy.disabled = c > st.cash;
  });
  updateDots();
}

/* ---------- desk ---------- */
const paneEl = document.getElementById('pane');
let dirtyDesk = true, deskSig = '';
function deskSignature() {
  // re-render only when affordability or ownership changes
  if (st.tab === 'mgr') return 'm' + BIZ.map((b, i) => (st.biz[i].mgr ? 'h' : st.cash >= b.mgr ? 'y' : 'n')).join('');
  if (st.tab === 'upg') return 'u' + UPG.filter(u => !st.upg[u.id]).slice(0, 8).map(u => u.id + (st.cash >= u.cost ? 'y' : 'n')).join(',');
  if (st.tab === 'fork') return 'f' + claimable() + forkArmed + st.diamonds;
  return 's' + Math.floor(Date.now() / 1000);
}
function renderDesk() {
  const sig = deskSignature();
  if (!dirtyDesk && sig === deskSig) return;
  dirtyDesk = false; deskSig = sig;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === st.tab));
  let h = '';
  if (st.tab === 'mgr') {
    h += '<p class="hint">Managers run a business on their own, even while this page is closed.</p>';
    BIZ.forEach((b, i) => {
      if (st.biz[i].mgr) return;
      h += `<div class="card av"><span class="pic">${ART.mgr[i] || ''}</span><span class="t">${b.mgrName}</span><span class="d">Runs ${b.name}. ${b.mgrDesc}.</span>
        <button id="hire-${i}" data-hire="${i}" ${st.cash < b.mgr ? 'disabled' : ''}>${money(b.mgr)}</button></div>`;
    });
    const hired = st.biz.filter(b => b.mgr).length;
    h += hired === BIZ.length ? '<p class="done">Every business has a manager.</p>' : hired ? `<p class="done">${hired} of ${BIZ.length} hired.</p>` : '';
    if (hired) h += '<div class="hired">' + BIZ.map((b, i) => st.biz[i].mgr ? `<span title="${b.mgrName}">${ART.mgr[i] || ''}</span>` : '').join('') + '</div>';
  } else if (st.tab === 'upg') {
    h += '<p class="hint">Each upgrade triples profit for one business, or for all of them.</p>';
    const open = UPG.filter(u => !st.upg[u.id]).slice(0, 8);
    open.forEach(u => {
      h += `<div class="card"><span class="t">${u.name}</span><span class="d">${u.t === -1 ? 'All businesses' : BIZ[u.t].name} profit ×3</span>
        <button id="upg-${u.id}" data-upg="${u.id}" ${st.cash < u.cost ? 'disabled' : ''}>${money(u.cost)}</button></div>`;
    });
    if (!open.length) h += '<p class="done">All upgrades bought.</p>';
    h += `<p class="done">${Object.keys(st.upg).length} of ${UPG.length} owned.</p>`;
  } else if (st.tab === 'fork') {
    const c = claimable();
    h += `<p class="hint">A hard fork resets your businesses, managers, upgrades and cash. You keep your Diamond Hands, and each one adds 2% to all profits forever.</p>
      <div class="statrow"><span>Diamond Hands now</span><span class="num">${st.diamonds} (+${st.diamonds * 2}%)</span></div>
      <div><div class="hint" style="color:var(--muted);font-size:12px">Joining on your next fork</div><div class="big num">+${c}</div></div>
      <div class="statrow"><span>Bonus after fork</span><span class="num">+${(st.diamonds + c) * 2}%</span></div>
      <p class="hint">Diamond Hands grow with the square root of lifetime earnings. The first one arrives at about ${money(1e12 / 22500)} earned.</p>`;
    if (!forkArmed) h += `<button class="fork" id="fork" data-fork="arm" ${c < 1 ? 'disabled' : ''}>Hard fork for ${c} Diamond Hands</button>`;
    else h += `<p class="hint" style="color:var(--down)">This resets everything except Diamond Hands. Continue?</p>
      <div class="row2"><button class="fork ghost" id="fork-no" data-fork="cancel">Keep playing</button><button class="fork" id="fork-yes" data-fork="go">Reset and fork</button></div>`;
  } else {
    const owned = st.biz.reduce((s, b) => s + b.n, 0);
    const rows2 = [
      ['Earned this fork', money(st.run)], ['Earned all time', money(st.allTime)], ['Per second (managed)', money(rateSec())],
      ['Businesses owned', owned.toLocaleString('en-US')], ['Upgrades owned', Object.keys(st.upg).length + ' / ' + UPG.length],
      ['Hard forks', st.forks], ['Time played', fmtDur(st.played)],
    ];
    h += rows2.map(([a, b]) => `<div class="statrow"><span>${a}</span><span class="num">${b}</span></div>`).join('');
    h += '<div class="row2" style="margin-top:6px"><button class="fork ghost" id="wipe" data-fork="wipe">Erase save and start over</button></div>';
    if (forkArmed === 'wipe') h += '<div class="row2"><button class="fork ghost" id="wipe-no" data-fork="cancel">Cancel</button><button class="fork" id="wipe-yes" data-fork="wipego">Erase everything</button></div>';
  }
  paneEl.innerHTML = h;
}
paneEl.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.hire) hire(+t.dataset.hire);
  if (t.dataset.upg) buyUpg(t.dataset.upg);
  const f = t.dataset.fork;
  if (f === 'arm') forkArmed = true;
  if (f === 'cancel') forkArmed = false;
  if (f === 'go') hardFork();
  if (f === 'wipe') forkArmed = 'wipe';
  if (f === 'wipego') { const tab = st.tab; st = fresh(); st.tab = tab; forkArmed = false; save(); toast('Save erased. Back to one faucet.'); }
  dirtyDesk = true; renderDesk();
});
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  st.tab = t.dataset.tab; forkArmed = false; dirtyDesk = true; renderDesk();
});
document.getElementById('seg').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  st.mode = t.dataset.m; syncSeg(); drawText();
});
function syncSeg() { document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === st.mode)); }
function updateDots() {
  document.getElementById('dot-mgr').hidden = st.tab === 'mgr' || !BIZ.some((b, i) => !st.biz[i].mgr && st.cash >= b.mgr);
  document.getElementById('dot-upg').hidden = st.tab === 'upg' || !UPG.some(u => !st.upg[u.id] && st.cash >= u.cost);
}

/* ---------- news ---------- */
let newsI = Math.floor(Math.random() * HEADLINES.length);
setInterval(() => { newsI = (newsI + 1) % HEADLINES.length; document.getElementById('newsT').textContent = HEADLINES[newsI]; }, 9000);

/* ---------- payout effects ---------- */
const lastFx = BIZ.map(() => 0);
function payFx(i, manual) {
  const now = performance.now();
  if (!manual && now - lastFx[i] < 1500) return;
  lastFx[i] = now;
  const t = rows[i].tile, r = t.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return;
  t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  try { window.CCBG && CCBG.burst(r.left + r.width / 2, r.top + r.height * 0.35, manual ? 10 : 5); } catch (e) {}
}

/* ---------- loop ---------- */
function step(dt) {
  st.played += dt;
  st.biz.forEach((b, i) => {
    if (!b.n) return;
    if (b.mgr) b.on = true;
    if (!b.on) return;
    b.p += dt / cycleTime(i);
    if (b.p >= 1) {
      const c = b.mgr ? Math.floor(b.p) : 1;
      earn(c * cycleRev(i));
      payFx(i, !b.mgr);
      if (b.mgr) b.p -= c; else { b.p = 0; b.on = false; }
    }
  });
  const now = Date.now();
  if (!whaleEl && now > whaleAt) spawnWhale();
  if (whaleEl && now > whaleGone) removeWhale();
}
let last = performance.now(), textAt = 0, saveAt = 0;
function frame(t) {
  const dt = Math.min(1, (t - last) / 1000); last = t;
  step(dt);
  drawBars();
  if (t - textAt > 100) { textAt = t; drawText(); renderDesk(); }
  if (t - saveAt > 5000) { saveAt = t; save(); }
  requestAnimationFrame(frame);
}

/* ---------- persistence ---------- */
function save() {
  st.saved = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) {}
}
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function hydrate(data) {
  const base = fresh();
  if (!data) return base;
  const s = Object.assign(base, data);
  s.biz = BIZ.map((_, i) => Object.assign({ n: 0, p: 0, on: false, mgr: false }, (data.biz || [])[i]));
  return s;
}
function offline() {
  const secs = (Date.now() - (st.saved || Date.now())) / 1000;
  if (secs < 10) return;
  const keepBull = st.bullUntil; st.bullUntil = 0;
  const r = rateSec(); st.bullUntil = keepBull;
  if (r <= 0) return;
  const gain = r * secs;
  earn(gain); st.played += secs;
  toast(`While you were away (${fmtDur(secs)}), your managers earned ${money(gain)}.`);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { last = performance.now(); } });
addEventListener('pagehide', save);

function start(data) {
  st = hydrate(data && data.st ? data.st : load());
  if (!(data && data.st)) offline();
  syncSeg(); dirtyDesk = true; drawText(); drawBars(); renderDesk();
  try {
    if (window.CCBG) {
      CCBG.init(document.getElementById('bg'), {
        unlocked: () => st.biz.filter(b => b.n > 0).length,
        owned: i => !!(st.biz[i] && st.biz[i].n > 0),
        bull: () => Date.now() < st.bullUntil,
        rate: rateSec,
      });
      CCBG.fxInit(document.getElementById('fx'));
    }
  } catch (e) {}
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.snapshot?.(() => ({ st }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
